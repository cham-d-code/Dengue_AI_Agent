name: CI/CD Dengue Dashboard

on:
  push:
    branches: [ main ] # Triggered every time you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dengue-app-repo
          IMAGE_TAG: latest
        run: |
          # Build from root context (.) using the subfolder Dockerfile (-f)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f dengue_pipeline/dashboard/Dockerfile .
          # Push it to your AWS ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Update Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to ECR inside the EC2 instance
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 390212478126.dkr.ecr.eu-north-1.amazonaws.com
            
            # 2. Pull the newest image from ECR
            docker pull 390212478126.dkr.ecr.eu-north-1.amazonaws.com/dengue-app-repo:latest
            
            # 3. FORCE remove container by NAME to prevent name conflicts
            # '|| true' ensures the pipeline continues even if no container exists to delete
            docker rm -f dengue-app || true
            
            # 4. Cleanup any other container stuck on port 8501 for safety
            docker ps -q --filter "publish=8501" | xargs -r docker stop
            docker ps -aq --filter "publish=8501" | xargs -r docker rm
            
            # 5. Run the new container in detached mode with auto-restart
            docker run -d \
              --name dengue-app \
              --restart always \
              -p 8501:8501 \
              390212478126.dkr.ecr.eu-north-1.amazonaws.com/dengue-app-repo:latest
            
            # 6. Cleanup unused images to save disk space on the t3.micro
            docker image prune -f